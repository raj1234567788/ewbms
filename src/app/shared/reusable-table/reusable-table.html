    <p-table [value]="data" [paginator]="paginator" [rowsPerPageOptions]="[5, 10, 20, 50]" [rows]="rows" [first]="first"
        (onPage)="onPageChange($event)" responsiveLayout="scroll">
        <ng-template pTemplate="header">
            <tr>
                <th *ngFor="let col of columns">
                    {{ col.header }}
                </th>
                <th *ngIf="actions.length">Actions</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-row>
            <tr>
                <td *ngFor="let col of columns">
                    {{ row[col.field] }}
                </td>

                <td *ngIf="actions.length">
                    <button *ngFor="let action of actions" pButton type="button" class="p-button-text p-button-sm me-2"
                        (click)="onAction(action.name, row)">
                        {{ action.label }}
                    </button>
                </td>
            </tr>
        </ng-template>

    </p-table>

</section>
